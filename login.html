<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36Bank - Login</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <nav class="navbar">
        <a href="main_page.html" class="nav-logo">36Bank</a>
        <ul class="nav-links">
            <li><a href="news.html">News</a></li>
            <li><a href="branchs.html">Branches</a></li>
            <li><a href="user_profile.html">Profile</a></li>
        </ul>
    </nav>
    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="card" style="width: 100%; max-width: 400px;">
            <h2 style="text-align: center; margin-bottom: 24px;">LOGIN</h2>
            <form action="main_page.html" method="GET">
                <input type="hidden" name="logged_in" value="true">
                <label for="username">Account</label>
                <input type="text" id="username" placeholder="Enter account" required>
                
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
                
                <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px; margin-top: 8px;">
                    <a href="forget_account.html" style="color: #3232b5; text-decoration: none; font-size: 14px;">Forget Account</a>
                    <a href="forget_password.html" style="color: #3939bc; text-decoration: none; font-size: 14px;">Forget Password</a>
                </div>
                
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 24px;">LOGIN</button>
            </form>
        </div>
    </div>
</body>
</html>
