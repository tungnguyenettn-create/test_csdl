<!-- Gradient applied directly to body via inline style for high priority -->
<body style="background: linear-gradient(135deg, #edf1f5 0%, #f8fafc 50%, #e2e8f0 100%); background-attachment: fixed; min-height: 100vh; margin: 0;">
    
    <nav class="navbar">
        <a href="main_page.html" class="nav-logo">36Bank</a>
        <ul class="nav-links">
            <li><a href="news.html">News</a></li>
            <li><a href="branchs.html">Branches</a></li>
            <li><a href="user_profile.html">Profile</a></li>
            <li><a href="login.html" id="loginBtn" class="btn-primary">LOGIN</a></li>

                $5,432.00

            <a href="show_history.html" class="icon-item">

            <a href="bill_type.html" class="icon-item">
                <div class="icon-box">
                    <svg width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                </div>
                <h4>PAY BILL</h4>
            </a>
            <a href="summary.html" class="icon-item">
                <div class="icon-box">
                    <svg width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>

                    <svg width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path d="M14 14h6v6h-6z"/></svg>
                </div>

            </a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('logged_in') === 'true') {
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('balanceDisplay').style.display = 'inline-block';
        }
    </script>
</body>
</html>
