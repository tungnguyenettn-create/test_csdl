<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36Bank - Forget Password</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <nav class="navbar">
        <a href="main_page.html" class="nav-logo">36Bank</a>
        <ul class="nav-links">
            <li><a href="news.html">News</a></li>
            <li><a href="branchs.html">Branches</a></li>
            <li><a href="user_profile.html">Profile</a></li>
        </ul>
    </nav>
    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="card" style="width: 100%; max-width: 400px;">
            <h2 style="text-align: center; margin-bottom: 24px;">FORGET PASSWORD</h2>
            <form action="login.html" method="GET">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" placeholder="Enter new password" required>
                
                <label for="confirm_password">New Password Confirmed</label>
                <input type="password" id="confirm_password" placeholder="Confirm new password" required>
                
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 24px;">RESET PASSWORD</button>
            </form>
        </div>
    </div>
</body>
</html>
