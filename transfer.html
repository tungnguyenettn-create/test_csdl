<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36Bank - Transfer</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="transfer.css">
</head>
<body>
    <nav class="navbar">
        <a href="main_page.html" class="nav-logo">36Bank</a>
        <ul class="nav-links">
            <li><a href="news.html">News</a></li>
            <li><a href="branchs.html">Branches</a></li>
            <li><a href="user_profile.html">Profile</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1>Transfer Funds</h1>
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <form>
                <div class="form-step">
                    <label>Select Bank</label>
                    <select><option>Bank A</option><option>Bank B</option></select>
                </div>
                <div class="form-step">
                    <label>Account Number</label>
                    <input type="text" placeholder="Enter account number">
                </div>
                <div class="form-step">
                    <label>Amount</label>
                    <input type="number" placeholder="Enter amount">
                </div>
                <button type="button" class="btn-primary" style="width: 100%;">Transfer</button>
            </form>
        </div>
    </div>
</body>
</html>
